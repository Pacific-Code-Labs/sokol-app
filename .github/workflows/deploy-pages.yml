name: Deploy to GitHub Pages (app.sokol.jcampos.dev)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Read-only role created by sokol-infrastructure web/web-params.yml (trusts this repo).
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_WEB_BUILD_ROLE_ARN }}
          aws-region: us-east-1

      - name: Load web config from SSM (/sokol/dev/web)
        run: bash scripts/load-env-from-ssm.sh dev - --github-env

      - run: pnpm test

      # i18n + hard-coded-text checks, typecheck, vite build, SPA 404 fallback
      - run: pnpm build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
